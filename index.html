<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thể Thao</title>
  <style>
    body { display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    a {
      display: inline-block;
      padding: 14px 28px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      transition: transform .2s ease, opacity .2s ease;
      min-width: 200px;
      text-align: center;
    }
    a:hover { transform: scale(1.05); opacity: 0.9; }

    .90p { background: #2563eb; }     /* Xanh dương */
    .ls { background: #16a34a; }     /* Xanh lá */
    .tc { background: #dc2626; }     /* Đỏ */
  </style>
</head>
<body>
  <a class="90p" href="https://90phutzzu.tv/" target="_blank">Link 1 : VB</a>
  <a class="ls" href="https://jimpollock.art/" target="_blank">Link 2 : XL</a>
  <a class="tc" href="https://manualidades.tv/" target="_blank">Link 3 : TC</a>
</body>
</html>
