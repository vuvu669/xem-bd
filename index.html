<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mở nhiều link</title>
  <style>
    body { display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #111; color: #fff; font-family: sans-serif; }
    a {
      display: inline-block;
      padding: 14px 28px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      transition: transform .2s ease, opacity .2s ease;
      min-width: 200px;
      text-align: center;
    }
    a:hover { transform: scale(1.05); opacity: 0.9; }

    .vb { background: #2563eb; }     /* Xanh dương */
    .xl { background: #16a34a; }     /* Xanh lá */
    .tc { background: #dc2626; }     /* Đỏ */
  </style>
</head>
<body>
  <a class="vb" href="https://vebotz.cc/" target="_blank">Link 1 : VB</a>
  <a class="xl" href="https://ls39.live/?source=1&gad_source=1&gad_campaignid=22633318721&gclid=Cj0KCQjw-4XFBhCBARIsAAdNOksIxUjMPRo7qWMSuxHnHqqPD0LFg3L-kAPG_wOPCTEgNUYYj6UxsccaAo3oEALw_wcB" target="_blank">Link 2 : XL</a>
  <a class="tc" href="https://b5.thapcam73.life/" target="_blank">Link 3 : TC</a>
</body>
</html>
